name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/test.js
      - run: node tools/sim.js --runs=500
      - name: draft the devlog post for today
        run: node tools/devlog.js --kind=balance || true
